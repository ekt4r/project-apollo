[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "project-apollo"
version = "0.1.0"
description = "Audio identification and timestamp localization with spectral fingerprints"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "soundfile>=0.13,<1",
    "jupyterlab>=4.3,<5",
    "ipykernel>=6.29,<8",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/apollo"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
